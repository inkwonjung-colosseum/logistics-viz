<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물류 개념 시각화</title>
<meta name="description" content="크로스독, LPN, SKU 등 물류 핵심 개념을 인터랙티브 시각화로 설명합니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚚%3C/text%3E%3C/svg%3E">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f14">
<style>
:root{
  color-scheme: light dark;
  --background: light-dark(#f7f8fa, #0e0f14);
  --foreground: light-dark(#1a1c22, #e9eaf0);
  --card: light-dark(#ffffff, #161923);
  --border: light-dark(#e4e6ec, #262a36);
  --muted: light-dark(#5f6470, #9aa0ae);
  --primary: light-dark(#2c5ce5, #7aa5ff);
  --primary-foreground: light-dark(#ffffff, #0d1526);
  --primary-soft: light-dark(rgb(44 92 229 / .08), rgb(122 165 255 / .13));
  --primary-glow: light-dark(rgb(44 92 229 / .07), rgb(122 165 255 / .09));
  --grid-line: light-dark(rgb(20 24 34 / .035), rgb(255 255 255 / .03));
  --chip: light-dark(#edeff4, #1e2230);
  --shadow-rest: light-dark(0 1px 2px rgb(20 24 34 / .05), 0 1px 2px rgb(0 0 0 / .45));
  --shadow-lift: light-dark(0 2px 4px rgb(20 24 34 / .05), 0 2px 4px rgb(0 0 0 / .5)),
                 light-dark(0 14px 36px rgb(20 24 34 / .10), 0 14px 36px rgb(0 0 0 / .55));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:400 16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:56px 22px 72px}

/* ── Hero ─────────────────────────────── */
header{position:relative;padding:10px 0 6px}
header::before{content:"";position:absolute;inset:-56px -22px 0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(560px 300px at 18% -8%, var(--primary-glow), transparent 72%),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:auto, 36px 36px, 36px 36px;
  -webkit-mask-image:radial-gradient(90% 100% at 50% 0, #000 30%, transparent 78%);
  mask-image:radial-gradient(90% 100% at 50% 0, #000 30%, transparent 78%);
}
.logo{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);margin-bottom:18px}
.logo svg{width:24px;height:24px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
header h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0 0 8px}
header .lede{margin:0;color:var(--muted);font-size:16px;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:24px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--muted)}

/* ── Filters ──────────────────────────── */
nav{display:flex;gap:8px;flex-wrap:wrap;margin:36px 0 20px}
nav button{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13.5px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-rest);transition:color .15s ease-out,background-color .15s ease-out,border-color .15s ease-out,transform .15s ease-out}
nav button b{font-weight:600;font-variant-numeric:tabular-nums;font-size:12px;opacity:.7}
nav button[aria-pressed="true"]{background:var(--foreground);border-color:var(--foreground);color:var(--background)}
@media (hover:hover){
  nav button:hover{color:var(--foreground);border-color:color-mix(in oklab, var(--foreground) 35%, var(--border))}
}

/* ── Concept cards ────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow-rest);transition:transform .2s cubic-bezier(.2,0,0,1),border-color .2s ease-out,box-shadow .2s ease-out}
.card-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.cat-ico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);flex:none}
.cat-ico svg{width:15px;height:15px}
.card .cat{font-size:12px;color:var(--primary);font-weight:600;letter-spacing:.02em}
.card h2{font-size:16.5px;font-weight:650;letter-spacing:-.01em;margin:0}
.card p{margin:0;font-size:13.5px;color:var(--muted);flex:1}
.card .go{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:13px;font-weight:600;color:var(--primary)}
.card .go svg{width:15px;height:15px;transition:transform .2s cubic-bezier(.2,0,0,1)}
@media (hover:hover){
  a.card:hover{transform:translateY(-2px);border-color:color-mix(in oklab, var(--primary) 45%, var(--border));box-shadow:var(--shadow-lift)}
  a.card:hover .go svg{transform:translateX(3px)}
}
@media (prefers-reduced-motion: no-preference){
  nav button:active:not(:disabled){transform:scale(.96)}
  a.card:active{transform:scale(.99)}
}

/* ── Ghost (upcoming) cards ───────────── */
a.card.ghost,div.card.ghost{background:transparent;border:1px dashed var(--border);box-shadow:none}
.card.ghost .cat-ico{background:transparent;color:var(--muted)}
.card.ghost .cat{color:var(--muted)}
.card.ghost h2{color:var(--muted);font-weight:600}
.card.ghost .go{color:var(--muted);font-weight:500}
.card.ghost .badge{background:transparent;color:var(--muted);border:1px dashed var(--border);padding:1px 7px}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px;font-variant-numeric:tabular-nums}
.card-top .donemark{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:11px;font-weight:700;flex:none}

/* ── Tracks ───────────────────────────── */
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin:30px 0 6px}
.track{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow-rest)}
.track h2{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:15px;font-weight:650;margin:0 0 4px}
.track h2 b{font-weight:600;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.track .desc{font-size:13px;color:var(--muted);margin:0 0 12px}
.track .bar{height:6px;background:var(--chip);border-radius:999px;overflow:hidden;margin:0 0 12px}
.track .bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .4s cubic-bezier(.2,0,0,1)}
.track .pills{display:flex;flex-wrap:wrap;gap:6px}
.track .pills a{font-size:12px;border-radius:999px;padding:4px 10px;text-decoration:none;color:var(--muted);border:1px solid var(--border);transition:color .15s ease-out,border-color .15s ease-out}
.track .pills a.did{background:var(--primary);border-color:transparent;color:var(--primary-foreground);font-weight:600}
@media (hover:hover){
  .track .pills a:hover{color:var(--foreground);border-color:color-mix(in oklab, var(--primary) 40%, var(--border))}
  .track .pills a.did:hover{color:var(--primary-foreground)}
}

/* ── Footer ───────────────────────────── */
footer{margin-top:60px;border-top:1px solid var(--border);padding-top:20px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:color .15s ease-out,border-color .15s ease-out}
@media (hover:hover){
  footer a:hover{color:var(--foreground);border-color:currentColor}
}
code{background:var(--chip);border-radius:6px;padding:1px 6px;font-size:12.5px}
.empty{border:1px dashed var(--border);border-radius:16px;padding:32px;color:var(--muted);font-size:14px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ── First-load entrance (runs once) ──── */
@media (prefers-reduced-motion: no-preference){
  @keyframes rise{from{opacity:0;filter:blur(4px);transform:translateY(12px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
  .enter{animation:rise .3s cubic-bezier(.2,0,0,1) both;animation-delay:var(--d,0ms)}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<header class="enter" style="--d:0ms">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5h11v10H2Z"/><path d="M13 9.5h3.8L21 13v3.5h-2.4"/><circle cx="6.6" cy="18" r="1.8"/><circle cx="16.4" cy="18" r="1.8"/><path d="M8.4 18h6.2"/></svg></span>
  <p class="eyebrow">Interactive Logistics Glossary</p>
  <h1>물류 개념 시각화</h1>
  <p class="lede">크로스독·LPN·SKU 같은 물류 핵심 개념을 인터랙티브 애니메이션으로 설명합니다.</p>
  <div class="stats" id="meta"></div>
</header>
<section id="tracks" class="tracks enter" style="--d:100ms" aria-label="학습 트랙"></section>
<nav id="filters" class="enter" style="--d:200ms" aria-label="카테고리 필터"></nav>
<main id="grid"></main>
<footer class="enter" style="--d:400ms">
  <span>전체 로드맵과 제작 규칙은 <code>docs/roadmap.md</code> · <code>docs/design-tokens.md</code>에 정리되어 있습니다.</span>
  <a href="https://github.com/inkwonjung-colosseum/logistics-viz">GitHub ↗</a>
</footer>
</div>
<script>
(() => {
  const ICON = {
    '창고 운영':'<path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2V8.2Z"/><path d="M3 8.2l9 5.2 9-5.2"/><path d="M12 13.4V21"/>',
    '식별·단위':'<path d="M4 5v14"/><path d="M8 5v14"/><path d="M12 5v9"/><path d="M16 5v14"/><path d="M20 5v9"/>',
    '재고':'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',
    '수송·네트워크':'<path d="M2 6.5h11v10H2Z"/><path d="M13 9.5h3.8L21 13v3.5h-2.4"/><circle cx="6.6" cy="18" r="1.8"/><circle cx="16.4" cy="18" r="1.8"/>',
    '주문·이행':'<rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9 4.5a3 3 0 0 1 6 0"/><path d="m9 14.5 2.2 2.2 4.3-4.7"/>',
    '자동화':'<rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/><rect x="10.6" y="10.6" width="2.8" height="2.8" rx=".6"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
    '시스템':'<rect x="3.5" y="4" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.5"/><path d="M7 7.25h.01"/><path d="M7 16.75h.01"/>',
    '전략':'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-1.8 5.2-5.2 1.8 1.8-5.2 5.2-1.8Z"/>'
  };
  const svg = (paths) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths+'</svg>';
  const ARROW = svg('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>');
  const iconFor = (cat) => svg(ICON[cat] || ICON['창고 운영']);

  const grid=document.getElementById('grid'),
        filters=document.getElementById('filters'),
        meta=document.getElementById('meta');
  let first=true;

  fetch('data/catalog.json').then(r=>r.json()).then(data=>{
    const items=data.concepts||[];
    const ghosts=(data.planned||[]).map(p=>({title:p.title,category:p.category,top:p.top}));
    const all=items.concat(ghosts);
    const cats=['전체',...new Set(all.map(c=>c.category))];
    const byId=Object.fromEntries(items.map(c=>[c.id,c]));
    const isDone=id=>{try{return !!localStorage.getItem('mv-done:'+id)}catch(_){return false}};
    let active='전체';
    meta.innerHTML=
      '<span class="stat"><b>'+items.length+'</b><span>공개된 시각화</span></span>'+
      '<span class="stat"><b>'+all.length+'</b><span>전체 로드맵</span></span>'+
      '<span class="stat"><b>'+(data.updated||'')+'</b><span>마지막 업데이트</span></span>';
    function renderTracks(){
      const box=document.getElementById('tracks');
      const tracks=data.tracks||[];
      if(!tracks.length){box.style.display='none';return;}
      box.innerHTML=tracks.map(t=>{
        const known=t.items.map(id=>byId[id]).filter(Boolean);
        const done=known.filter(c=>isDone(c.id)).length;
        const pct=known.length?Math.round(done/known.length*100):0;
        const pills=known.map(c=>'<a class="'+(isDone(c.id)?'did':'')+'" href="'+c.file+'" title="'+c.title+'">'+(isDone(c.id)?'✓ ':'')+c.title+'</a>').join('');
        return '<div class="track"><h2>'+t.title+'<b>'+done+'/'+known.length+'</b></h2>'+
          '<p class="desc">'+t.desc+'</p>'+
          '<div class="bar"><i style="width:0%"></i></div>'+
          '<div class="pills">'+pills+'</div></div>';
      }).join('');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        box.querySelectorAll('.bar i').forEach((el,i)=>{
          const t=tracks[i];const known=t.items.map(id=>byId[id]).filter(Boolean);
          const done=known.filter(c=>isDone(c.id)).length;
          el.style.width=(known.length?Math.round(done/known.length*100):0)+'%';
        });
      }));
    }
    function renderFilters(){
      filters.innerHTML='';
      cats.forEach(c=>{
        const n=c==='전체'?all.length:all.filter(x=>x.category===c).length;
        const b=document.createElement('button');
        b.type='button';
        b.innerHTML=c+' <b>'+n+'</b>';
        b.setAttribute('aria-pressed', String(c===active));
        b.onclick=()=>{active=c; renderFilters(); renderGrid();};
        filters.appendChild(b);
      });
    }
    function renderGrid(){
      const live=items.filter(c=>active==='전체'||c.category===active);
      const soon=ghosts.filter(c=>active==='전체'||c.category===active);
      grid.innerHTML='';
      if(!live.length&&!soon.length){
        grid.innerHTML='<div class="empty">해당 카테고리의 콘텐츠가 아직 없습니다. 로드맵을 참고하세요.</div>';
        return;
      }
      live.forEach((c,i)=>grid.appendChild(card(c,i,false)));
      soon.forEach((c,i)=>grid.appendChild(card(c,live.length+i,true)));
    }
    function card(c,i,ghost){
      const el=document.createElement(ghost?'div':'a');
      el.className='card'+(ghost?' ghost':'');
      if(!ghost)el.href=c.file;
      if(first){el.classList.add('enter');el.style.setProperty('--d',(200+Math.min(i*40,320))+'ms');}
      el.innerHTML='<span class="card-top"><span class="cat-ico">'+iconFor(c.category)+'</span><span class="cat">'+c.category+'</span>'+(c.top?'<span class="badge">TOP '+c.top+'</span>':'')+(!ghost&&isDone(c.id)?'<span class="donemark" title="학습 완료">✓</span>':'')+'</span>'+
        '<h2>'+c.title+'</h2>'+
        (ghost?'<p>제작 예정 — 로드맵에 포함된 개념입니다.</p>':'<p>'+c.summary+'</p>')+
        (ghost?'<span class="go">준비중</span>':'<span class="go">시각화 보기 '+ARROW+'</span>');
      return el;
    }
    renderTracks(); renderFilters(); renderGrid();
    first=false;
  }).catch(()=>{
    grid.innerHTML='<div class="empty">카탈로그를 불러오지 못했습니다. 로컬에서는 <code>python3 -m http.server</code>로 서버를 띄워 접속하세요. 배포 후에는 정상 표시됩니다.</div>';
  });
})();
</script>
</body>
</html>
